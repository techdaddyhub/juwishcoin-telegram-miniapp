<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Interactive 3D Gold JuwishCoin Medallion Scene
const container = document.getElementById('threejs-container') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth || 360;
const height = container.clientHeight || 320;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 5.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
container.appendChild(renderer.domElement);

// Lighting setup for rich metallic gold shine
const ambientLight = new THREE.AmbientLight(0xffeedd, 1.2);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffd700, 3.2);
dirLight1.position.set(4, 5, 4);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xffa500, 2.0);
dirLight2.position.set(-4, -2, 3);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0xffffff, 2.5, 10);
pointLight.position.set(0, 2, 3.5);
scene.add(pointLight);

// Create Coin Medallion Group
const coinGroup = new THREE.Group();
scene.add(coinGroup);

// Main Coin Body (Gold Cylinder)
const coinGeo = new THREE.CylinderGeometry(1.65, 1.65, 0.22, 64);
const coinMat = new THREE.MeshPhongMaterial({
  color: 0xffd000,
  emissive: 0x442200,
  specular: 0xffffff,
  shininess: 95,
  flatShading: false
});
const coinMesh = new THREE.Mesh(coinGeo, coinMat);
coinMesh.rotation.x = Math.PI / 2;
coinGroup.add(coinMesh);

// Outer Embossed Beveled Rim
const rimGeo = new THREE.TorusGeometry(1.62, 0.09, 24, 64);
const rimMat = new THREE.MeshPhongMaterial({
  color: 0xffe680,
  emissive: 0x331a00,
  specular: 0xffffff,
  shininess: 120
});
const rimFront = new THREE.Mesh(rimGeo, rimMat);
rimFront.position.z = 0.115;
coinGroup.add(rimFront);

const rimBack = rimFront.clone();
rimBack.position.z = -0.115;
coinGroup.add(rimBack);

// Medallion Star of David Motif
const starGroup = new THREE.Group();
const triGeo = new THREE.BufferGeometry();
const r = 0.95;
const t1Vertices = new Float32Array([
  0, r, 0.125,
  r * Math.cos(Math.PI / 6), -r * Math.sin(Math.PI / 6), 0.125,
  -r * Math.cos(Math.PI / 6), -r * Math.sin(Math.PI / 6), 0.125
]);
triGeo.setAttribute('position', new THREE.BufferAttribute(t1Vertices, 3));
triGeo.computeVertexNormals();

const starMat = new THREE.MeshPhongMaterial({
  color: 0xfff0a0,
  emissive: 0x553300,
  specular: 0xffffff,
  shininess: 100,
  side: THREE.DoubleSide
});
const t1 = new THREE.Mesh(triGeo, starMat);
starGroup.add(t1);

const t2 = t1.clone();
t2.rotation.z = Math.PI;
starGroup.add(t2);

coinGroup.add(starGroup);

// Backside Star
const starBack = starGroup.clone();
starBack.position.z = -0.25;
coinGroup.add(starBack);

// Gold Particle Halo / Accelerator Ring
const particleCount = 75;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  const angle = (i / particleCount) * Math.PI * 2;
  const rad = 2.05 + (Math.random() - 0.5) * 0.45;
  pPos[i * 3] = Math.cos(angle) * rad;
  pPos[i * 3 + 1] = Math.sin(angle) * rad;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 0.6;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0xffd700,
  size: 0.065,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Tilt coin slightly for dimensional luxury look
coinGroup.rotation.x = 0.25;
coinGroup.rotation.y = 0.35;

// Animation Render Loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();
  
  // Continuous smooth metallic spin
  coinGroup.rotation.y += 0.016;
  coinGroup.position.y = Math.sin(elapsedTime * 1.8) * 0.12;
  
  // Counter-rotating particle field
  particles.rotation.z -= 0.008;
  particles.rotation.x = Math.sin(elapsedTime * 0.6) * 0.15;
  
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const newW = container.clientWidth || window.innerWidth;
  const newH = container.clientHeight || 320;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
