name: Deploy JuwishCoin Telegram Mini App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
              - name: Compile Optimized Web Release
        run: flutter build web --release -O4 --no-source-maps --base-href "/juwishcoin-telegram-miniapp/"

      - name: Compile Optimized Web Release
        run: |
          # Detect repo name for base-href if hosted on user.github.io/repo/
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Building for repository: $REPO_NAME"
          flutter build web --release --web-renderer auto -O4 --no-source-maps --base-href "/$REPO_NAME/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
